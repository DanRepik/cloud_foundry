name: publish

# Builds and publishes cloud-foundry to PyPI when a GitHub Release is
# published. The release tag is the source of truth for the version: the
# build job stamps vX.Y.Z into cloud_foundry/__init__.py's `version`
# (read via [tool.hatch.version] in pyproject.toml) before building, so
# nothing has to be bumped by hand and a forgotten bump can no longer make
# a publish fail. The `version` committed in the repo is only what a
# source checkout reports; PyPI gets the tag's.
#
# Tag releases as vX.Y.Z (e.g. v0.5.2); anything else fails fast, and PyPI
# rejects a re-upload of an already-published version.
#
# Publishing uses PyPI Trusted Publishing (OIDC) -- no PyPI token is
# stored anywhere. One-time setup: on the cloud-foundry project's PyPI
# page, Settings > Publishing > add a GitHub trusted publisher for
# owner=DanRepik, repo=cloud_foundry, workflow=publish.yml,
# environment=pypi.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # cloud_foundry/services/authorization_api/security_lambda.py builds
      # a boto3 cognito-idp client at import time -- see pytest.yml.
      AWS_DEFAULT_REGION: us-east-1
      AWS_REGION: us-east-1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      # The LocalStack stack tests (tests/test_aws_open_api_editor.py) run
      # the pulumi CLI through the Automation API -- see pytest.yml.
      - uses: pulumi/actions@v6
      - run: python -m pip install --upgrade pip
      - run: pip install -e .[dev]
      # Not in the dev extra -- see the note above it in pyproject.toml:
      # a git-pinned dependency there would make every publish fail the
      # same way this workflow exists to prevent.
      - run: pip install git+https://github.com/DanRepik/fixture_foundry.git@fix/fixtures-stale-teardown-calls
      - run: pytest tests

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Stamp the release tag's version into the package
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([abrc.]*[0-9]+)?$ ]]; then
            echo "::error::Release tag '${tag}' is not vX.Y.Z (e.g. v0.5.2)."
            exit 1
          fi
          version="${tag#v}"
          sed -i -E "s/^version = \"[^\"]*\"/version = \"${version}\"/" cloud_foundry/__init__.py
          grep -n '^version = ' cloud_foundry/__init__.py
          grep -q "^version = \"${version}\"" cloud_foundry/__init__.py

      # python -m build, not flit -- the declared [build-system] backend
      # is hatchling, which understands [tool.hatch.version]. flit's own
      # dynamic-version detection only recognizes a literal __version__
      # attribute via AST parsing and doesn't know about hatchling's
      # regex-based version source, so building/publishing with flit
      # against a hatchling-configured project is a mismatch worth
      # avoiding entirely rather than working around.
      - name: Install build backend
        run: python -m pip install --upgrade pip build

      - name: Build sdist and wheel
        run: python -m build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
