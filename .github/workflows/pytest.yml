name: Run Pytest on Pull Requests

on:
  pull_request:
    branches:
      - main  # Change to your default branch if needed

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # cloud_foundry/services/authorization_api/security_lambda.py creates
      # a boto3 cognito-idp client at import time, so pytest collection
      # needs a region even for tests that never call AWS. Real Lambda
      # deploys always have one set via the runtime environment already.
      AWS_DEFAULT_REGION: us-east-1

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run pytest
        run: pytest tests
