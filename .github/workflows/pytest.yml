name: Run Pytest on Pull Requests

on:
  pull_request:
    branches:
      - main  # Change to your default branch if needed

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # cloud_foundry/services/authorization_api/security_lambda.py creates
      # a boto3 cognito-idp client at import time, so pytest collection
      # needs a region even for tests that never call AWS. boto3's client
      # construction only reads AWS_DEFAULT_REGION (AWS_REGION is Lambda's
      # own reserved var, only consulted by a separate smart-defaults
      # heuristic) -- setting both here removes any doubt and mirrors what
      # a real Lambda execution environment provides.
      AWS_DEFAULT_REGION: us-east-1
      AWS_REGION: us-east-1

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
          # Not in the dev extra -- see the note above it in pyproject.toml:
          # a git-pinned dependency there would break every PyPI publish.
          pip install git+https://github.com/DanRepik/fixture_foundry.git@fix/fixtures-stale-teardown-calls

      - name: Run pytest
        run: pytest tests
