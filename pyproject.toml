# src/pyproject.toml

[build-system]
# hatchling>=1.32.0 emits Metadata-Version: 2.5, which PyPI's Warehouse
# rejects outright with a 400 on every upload regardless of package
# version -- see https://github.com/pypi/warehouse/issues/19083 (open,
# unresolved). Pinned below that until Warehouse adds 2.5 support.
requires = ["hatchling>=1.0,<1.32.0"]
build-backend = "hatchling.build"

[project]
name = "cloud-foundry"
dynamic = ["version"]
authors = [
    { name = "Daniel Repik", email = "danrepik@icloud.com" }
]
description = "cloud-foundry is a curated set of cloud components that can be used to assemble cloud-based applications."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
dependencies = [
    "pulumi",
    "pulumi-aws",
    "boto3",
]
classifiers = [
    "Programming Language :: Python :: 3.9",
    "Operating System :: OS Independent",
]
urls = { "Documentation" = "https://github.com/DanRepik/cloud-foundry", "Source" = "https://github.com/DanRepik/cloud-foundry" }

# Optional extras
[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.0.0",
    "flit>=3.9",
    "pre-commit",
    "flake8",
    "build",
    "twine",
    # Needed by the real (non-mocked) test suite, which deploys against
    # LocalStack via fixture_foundry.
    "docker",
    "pulumi-automation",
    "requests",
    "python-dotenv",
    "pyjwt",
    "psycopg2-binary",
    # In-process S3 for the UIPublisher sync provider's unit tests.
    "moto[s3]>=5.0",
]

# fixture_foundry is NOT listed above on purpose. PyPI's upload API rejects
# any package whose metadata declares a direct URL/VCS dependency, even one
# scoped to an optional extra -- so a git-pinned entry here would block
# every future `cloud-foundry` publish, not just fail quietly. Published
# fixture_foundry (still 0.2.4 as of this pin) has stale calls into its own
# context.py API that crash test collection (see DanRepik/fixture_foundry#4,
# fixed on branch fix/fixtures-stale-teardown-calls but not yet released).
# Install it separately before running the integration test suite:
#   pip install git+https://github.com/DanRepik/fixture_foundry.git@fix/fixtures-stale-teardown-calls
# CI does this as its own step -- see .github/workflows/pytest.yml and
# publish.yml. Once a fixed version is published to PyPI, add a plain
# "fixture_foundry>=X.Y.Z" back to the dev extra above and drop this note.

[tool.pytest.ini_options]
pythonpath = [".."]
testpaths = ["tests"]
addopts = "--ignore=examples"
markers = [
    "unit: marks tests as unit tests that do not require a database",
    "integration: marks tests that operate on a real database",
]

# Hatch support for local dev flows (keeps flit for building)
[tool.hatch.envs.default]
dependencies = [
    "pytest>=7.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.0.0",
    "flit>=3.9",
]

[tool.hatch.build.targets.sdist]
include = ["cloud_foundry"]

[tool.hatch.build.targets.wheel]
include = ["cloud_foundry"]

[tool.hatch.version]
path = "cloud_foundry/__init__.py"

[tool.hatch.envs.default.scripts]
test = "pytest -q"
test_unit = "pytest -q -m unit"
test_integration = "pytest -q -m integration"
cov = "pytest -q --cov=cloud_foundry --cov-report=term-missing"
fmt = [
    "black .",
    "isort .",
]
lint = [
    "black --check .",
    "isort --check-only .",
    "mypy cloud_foundry",
]
build = "flit build"
publish = "flit publish"
