# src/pyproject.toml

[build-system]
requires = ["hatchling>=1.0"]
build-backend = "hatchling.build"

[project]
name = "cloud-foundry"
dynamic = ["version"]
authors = [
    { name = "Daniel Repik", email = "danrepik@icloud.com" }
]
description = "cloud-foundry is a curated set of cloud components that can be used to assemble cloud-based applications."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
dependencies = [
    "pulumi",
    "pulumi-aws",
    "boto3",
]
classifiers = [
    "Programming Language :: Python :: 3.9",
    "Operating System :: OS Independent",
]
urls = { "Documentation" = "https://github.com/DanRepik/cloud-foundry", "Source" = "https://github.com/DanRepik/cloud-foundry" }

# Optional extras
[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.0.0",
    "flit>=3.9",
    "pre-commit",
    "flake8",
    "build",
    "twine",
    # Needed by the real (non-mocked) test suite, which deploys against
    # LocalStack via fixture_foundry.
    "docker",
    "pulumi-automation",
    "requests",
    "python-dotenv",
    "pyjwt",
    # TEMPORARY: pinned to a fix branch because published fixture_foundry
    # (0.2.4) has stale calls into its own context.py API that crash
    # test collection (see DanRepik/fixture_foundry#4). Revert to a plain
    # "fixture_foundry" once that PR merges and a fixed version is
    # published to PyPI.
    "fixture_foundry @ git+https://github.com/DanRepik/fixture_foundry.git@fix/fixtures-stale-teardown-calls",
    "psycopg2-binary",
]

[tool.pytest.ini_options]
pythonpath = [".."]
testpaths = ["tests"]
addopts = "--ignore=examples"
markers = [
    "unit: marks tests as unit tests that do not require a database",
    "integration: marks tests that operate on a real database",
]

# Required for the temporary git-URL pin on fixture_foundry in the dev
# extra above (revert together once that pin goes back to a plain PyPI
# dependency).
[tool.hatch.metadata]
allow-direct-references = true

# Hatch support for local dev flows (keeps flit for building)
[tool.hatch.envs.default]
dependencies = [
    "pytest>=7.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.0.0",
    "flit>=3.9",
]

[tool.hatch.build.targets.sdist]
include = ["cloud_foundry"]

[tool.hatch.build.targets.wheel]
include = ["cloud_foundry"]

[tool.hatch.version]
path = "cloud_foundry/__init__.py"

[tool.hatch.envs.default.scripts]
test = "pytest -q"
test_unit = "pytest -q -m unit"
test_integration = "pytest -q -m integration"
cov = "pytest -q --cov=cloud_foundry --cov-report=term-missing"
fmt = [
    "black .",
    "isort .",
]
lint = [
    "black --check .",
    "isort --check-only .",
    "mypy cloud_foundry",
]
build = "flit build"
publish = "flit publish"
